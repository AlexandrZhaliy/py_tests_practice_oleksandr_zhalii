name: CI

on:
  push:
    branches: [main, homework31]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lesson_31/requirements-ci.txt

      - name: Install requirements
        run: pip install -r lesson_31/requirements-ci.txt

      - name: Run tests
        run: pytest lesson_12 lesson_13 -v --alluredir=allure-results --junitxml=junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            allure-results
            junit.xml